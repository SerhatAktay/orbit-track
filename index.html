<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OrbiT</title>
  <style>
    :root { --bg: #ffffff; --fg: #1b1f24; --muted: #6b7280; --grid: #f0f2f5; --line: #d8dce2; --panel: #f8f9fb; --accent: #1f77b4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171c; --fg: #e6e8eb; --muted: #9aa3ad; --grid: #1d2128; --line: #2e343c; --panel: #191d23; --accent: #5aa9e6; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 13px system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font-size: 15px; margin: 0 8px 0 0; }
    button, select, input { font: inherit; color: inherit; }
    button, select { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    input[type=number] { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
    .spacer { flex: 1; }
    main { flex: 1; display: flex; min-height: 0; }
    #canvas-area { flex: 1; position: relative; min-width: 0; }
    #canvas-area.dragover { outline: 3px dashed var(--accent); outline-offset: -3px; }
    svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    svg:active { cursor: grabbing; }
    #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); pointer-events: none; line-height: 1.6; }
    #error-banner { position: absolute; top: 0; left: 0; right: 0; background: #c0392b; color: white; padding: 8px 12px; display: none; z-index: 5; }
    #tooltip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); padding: 4px 8px; border-radius: 4px; font-size: 12px; display: none; white-space: pre; z-index: 4; }
    #status { position: absolute; left: 10px; bottom: 8px; color: var(--muted); font-size: 12px; pointer-events: none; }
    aside { width: 300px; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 8px; }
    .track-card { border: 1px solid var(--line); border-radius: 6px; padding: 6px; margin-bottom: 6px; background: var(--bg); }
    .row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
    .row.small { font-size: 12px; color: var(--muted); }
    .row.small input[type=number] { width: 64px; }
    .row.small input[type=range] { flex: 1; }
    .track-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    input[type=color] { width: 24px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
    .grip { cursor: grab; color: var(--muted); user-select: none; }
    .hint { color: var(--muted); font-size: 12px; }
    kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>OrbiT</h1>
    <button id="open-files">Open files…</button>
    <input id="file-input" type="file" multiple hidden accept=".bw,.bigwig,.bed,.gtf,.gff,.gff3,.gb,.gbk,.gbff,.genbank" />
    <button id="demo">Demo (human mtDNA)</button>
    <select id="chrom" title="Chromosome" hidden></select>
    <span class="spacer"></span>
    <button id="reset-zoom" title="Reset view (R)">Reset view</button>
    <button id="save-session" title="Save view and track settings">Save session</button>
    <button id="load-session" title="Restore settings; then open the same data files">Load session</button>
    <input id="session-input" type="file" accept=".json" hidden />
    <button id="export-svg">SVG</button>
    <button id="export-png">PNG</button>
    <button id="export-html" title="Single shareable HTML file">HTML</button>
  </header>
  <main>
    <div id="canvas-area">
      <div id="error-banner"></div>
      <svg id="canvas"><g id="viewport"></g><g id="overlay" pointer-events="none"></g></svg>
      <div id="empty">Drop bigWig (.bw) and annotation (.bed / .gtf / .gff) files here<br />Plus/minus strand pairs (<code>x.plus.bw</code> + <code>x.minus.bw</code>) merge automatically</div>
      <div id="tooltip"></div>
      <div id="status"></div>
    </div>
    <aside>
      <div id="track-list"></div>
      <p class="hint">Scroll: zoom at cursor · drag: rotate · double-click: zoom in (<kbd>Shift</kbd> out) · click a feature: zoom to it · <kbd>R</kbd>: reset</p>
    </aside>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
